# Findings in Cargo.lock that the scan may pass over, each with the reason. A real, known
# vulnerability in code that Budget ships or builds with never belongs here.
#
# Cargo.lock records the dependencies of every platform Tauri supports, but Budget is only
# built for Windows. The crates listed below belong to Tauri's Linux backend (GTK, and the
# D-Bus crates zbus uses) and are not in the Windows build at all. To check:
#   cargo tree --locked --target x86_64-pc-windows-msvc -e normal,build -i <crate>
# prints "nothing to print" for each of them.
#
# Review this list whenever tauri is upgraded, and delete an entry once the crate is gone
# from Cargo.lock.

# --- Permanent: not in the Windows build ---------------------------------------------------

# Also published as RUSTSEC-2024-0429; one entry covers both ids.
[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
reason = "glib 0.18 is only used by Tauri's Linux GTK backend; it is not compiled into the Windows build."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0370"
reason = "proc-macro-error (unmaintained) is a build-time macro of the Linux GTK crates; it is not in the Windows build."

# zbus is Linux's D-Bus client; these three are its own crates, reported unmaintained on
# 2026-10-16 with no fixed version. Not a known vulnerability, and none is built for Windows.
[[IgnoredVulns]]
id = "RUSTSEC-2026-0370"
reason = "zvariant (unmaintained) is only used by zbus, Linux's D-Bus client; it is not in the Windows build."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0371"
reason = "zbus_names (unmaintained) is only used by zbus, Linux's D-Bus client; it is not in the Windows build."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0372"
reason = "zvariant_derive (unmaintained) is a build-time macro of zbus, Linux's D-Bus client; it is not in the Windows build."
