[package]
name = "budget-desktop"
version = "0.1.0"
description = "Budget desktop shell: opens the window and starts/stops the Java backend. No business logic."
edition = "2021"
publish = false

# Pinned exactly, so a routine `cargo update` cannot pull in a release younger than 14 days
# (spec §7); transitive versions are recorded in Cargo.lock (commit it). No updater plugin,
# by design: the app never makes outbound network calls.
[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
# tray-icon: the tray while phone access is on (spec §10, Phase 12); its crates come with Tauri itself.
tauri = { version = "=2.12.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.4.5"
getrandom = "0.3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

# The Windows startup entry for Start with Windows (spec §10, Phase 12). Already in the build through
# Tauri's own tooling, so nothing new is downloaded; used directly in place of an autostart plugin.
[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"
