<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget</title>
    <!-- Shown by the desktop shell for the moment it takes the backend to start. Static on
         purpose: no scripts, no external assets. Colors pass WCAG AA in both themes. -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: #f1f3f5;
        color: #1b1f27;
      }
      main { padding: 1.5rem; text-align: center; }
      h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
      p { margin: 0; color: #566070; }
      @media (prefers-color-scheme: dark) {
        body { background: #11151c; color: #e8ebf0; }
        p { color: #a3adbb; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Budget</h1>
      <p role="status">Opening your budget…</p>
    </main>
  </body>
</html>
