# Build-time checks only. Nothing here ships in the app, which makes no outbound network
# calls of any kind (spec §1).
name: CI

on:
  # Every branch but main. A pull request shows the checks of its latest commit, so there is
  # no separate pull_request trigger running everything twice.
  #
  # Work reaches main only through a pull request whose branch has already passed the tests
  # and the dependency checks, so a push to main runs nothing.
  push:
    branches-ignore:
      - main
  # New vulnerabilities are published without anyone touching the code: re-scan weekly.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# Read-only token, no secrets: no job here needs to write to the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a commit, not a tag, so a retagged release cannot change what runs.
jobs:
  backend:
    name: Backend tests
    if: ${{ github.event_name != 'schedule' }}
    # The app only ships on Windows, so its tests (file locks, data folder, lifecycle) run there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: backend
        run: .\mvnw.cmd -B verify

  frontend:
    name: Frontend tests
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  dependencies:
    name: Dependency checks
    # Branch pushes, the weekly run and manual runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so the age check can compare lockfiles with the main branch.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # pom.xml only names direct dependencies. This writes every library the backend really
      # uses, transitive ones included, to backend/target/bom.json for the two checks below.
      - name: List backend dependencies
        working-directory: backend
        run: ./mvnw -B -q -DskipTests package org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
      # Fails the build if any Maven, npm or Cargo dependency has a known vulnerability in the
      # OSV database. Findings the scan may pass over are listed, with reasons, in
      # desktop/src-tauri/osv-scanner.toml; the temporary ones there carry an end date.
      - name: Scan for known vulnerabilities
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=backend/target/bom.json
            --lockfile=frontend/package-lock.json
            --lockfile=desktop/src-tauri/Cargo.lock
      # Fails the build if a dependency version was published less than 14 days ago, unless it
      # is a named exception in dependency-age-exceptions.json. Runs on the weekly run too, so
      # that an exception which has reached 14 days is reported and removed even if nobody
      # pushes; and still runs when the scan above has findings.
      - name: Check that no dependency is newer than 14 days
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./check-dependency-age.ps1 -BaseRef origin/main

  installer:
    name: Windows installer
    # Only when asked for by hand ("Run workflow" on the Actions tab), once the tests have
    # passed. An hour on a Windows runner is billed double, which used most of a month's
    # allowance in a few builds; the installer to try is built on the PC with
    # build-installer.ps1 instead. The two test jobs have just run both suites on this same
    # commit, so the script is told not to run them a second time.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: [backend, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # A fresh runner would compile the Tauri command-line tool and every Rust library the
      # shell uses from source every time, which was nearly all of this job's hour. Three
      # things are kept between runs: the tool itself, which is one fixed version; Cargo's
      # package downloads, which Cargo.lock checksums; and the compiled libraries, which
      # depend only on Cargo.lock and the compiler. The shell's own code is never reused: its
      # compiled output is removed below, so what ships is always compiled from this commit.
      - name: Read the Tauri CLI and Rust versions
        id: tauri
        shell: pwsh
        run: |
          $line = Select-String -Path build-installer.ps1 -Pattern "^\`$TauriCli\s*=\s*'([^']+)'"
          if (-not $line) { throw 'Could not find $TauriCli in build-installer.ps1.' }
          "version=$($line.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
          $rust = (rustc --version) -replace '[^0-9A-Za-z.]+', '-'
          "rust=$rust" >> $env:GITHUB_OUTPUT
      # No restore-keys on either cache: a new version or a changed Cargo.lock starts from nothing.
      - name: Cache the Tauri CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-${{ runner.os }}-${{ steps.tauri.outputs.version }}
      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
          key: cargo-registry-${{ runner.os }}-${{ steps.tauri.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      # A new compiler or a changed Cargo.lock starts from nothing, like the two caches above.
      - name: Cache the compiled Rust libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: desktop/src-tauri/target
          key: cargo-target-${{ runner.os }}-${{ steps.tauri.outputs.rust }}-${{ steps.tauri.outputs.version }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      # Whatever the cache brought back of the shell itself, and any installer built before, goes.
      - name: Remove the shell's own compiled output
        shell: pwsh
        working-directory: desktop/src-tauri
        run: |
          if (Test-Path target) {
            cargo clean --release --package budget-desktop
            if ($LASTEXITCODE -ne 0) { throw 'cargo clean failed.' }
            Remove-Item -Recurse -Force target/release/bundle -ErrorAction SilentlyContinue
          }
      # The Rust toolchain and the Visual Studio C++ Build Tools are already on the runner.
      - name: Build the installer
        shell: pwsh
        run: .\build-installer.ps1 -SkipTests
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: budget-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
